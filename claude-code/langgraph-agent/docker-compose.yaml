version: '3.8'

services:
  # 作業ディレクトリ用のAPIサーバー
  working:
    build:
      context: ./working-directory
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./working-directory:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./working-directory/.env
    container_name: langgraph-agent-working
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # 完成例用のAPIサーバー
  example:
    build:
      context: ./completed-example
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./completed-example:/app
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./completed-example/.env
    container_name: langgraph-agent-example
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
